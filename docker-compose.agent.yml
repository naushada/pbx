# docker-compose.agent.yml
#
# On-prem pbx-agent stack: MongoDB + Asterisk + coturn + pbx-agent.
# Mirrors xpmile's `docker-compose.agent.yml` shape but for the VoIP
# control plane.
#
# Usage (production):
#   cp .env.agent.example .env
#   # …edit .env (CLOUD_HOST, AGENT_SOCIETY_ID, etc.)…
#   podman-compose -f docker-compose.agent.yml up --build -d
#
# Required env (set in .env or shell):
#   CLOUD_HOST          Heroku hostname (e.g. pabx-5fbf3550f938.herokuapp.com)
#   AGENT_SOCIETY_ID    Society id this agent serves
#
# Optional env (sensible defaults):
#   CLOUD_PORT          Heroku port                  (default: 443)
#   MONGO_DB_NAME       Mongo database name          (default: pabx)
#   ARI_USER / ARI_PASS Asterisk REST creds          (default: asterisk/asterisk)
#   TURN_PUBLIC_PORT    Society's public TURN UDP    (default: 3478)
#   CERTS_DIR           pbx-agent mTLS cert dir      (default: ./certs/cloud-issued/sip-agent
#                                                     — auto-populated by
#                                                     `./deploy-heroku.sh deploy`)
#   INNERTLS_DIR        pbx-wsdbagent /ws/db inner-TLS dir
#                                                    (default: ./certs/cloud-issued/innertls
#                                                     — auto-populated by deploy)
#
# Networks:
#   pbx-net  — internal bridge for service-to-service traffic.
#   Asterisk's WS port (8088) is NOT exposed to the host.
#   coturn's port is exposed via TURN_PUBLIC_PORT for off-LAN browsers.
#

services:

  # ──────────────────────────────────────────────────────────────────
  # MongoDB — persistent store: subscribers, cdr, push_subscriptions.
  # ──────────────────────────────────────────────────────────────────
  pbx-mongo:
    image: mongo:7
    container_name: pbx-mongo
    restart: unless-stopped
    # Single-node replica set so the agent's SubscriberWatcher can use
    # Mongo change streams to react to subscriber inserts/updates/deletes
    # in real time (DESIGN.md §4 — pjsip provisioning). A 1-node RS is
    # supported and behaves like a standalone for reads/writes — only the
    # oplog is enabled, which is what change streams need.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - pbx_mongo_data:/data/db
    networks:
      - pbx-net
    healthcheck:
      # Idempotent init: first run finds rs.status() throws NotYetInitialized
      # and runs rs.initiate(); every subsequent tick finds it OK and is a
      # no-op. The healthcheck doubles as the init mechanism so dependent
      # services (`condition: service_healthy`) only start once the RS is up.
      test:
        - "CMD"
        - "mongosh"
        - "--quiet"
        - "--eval"
        - >-
          try {
            rs.status().ok ? quit(0) : quit(1);
          } catch (e) {
            if (e.codeName === 'NotYetInitialized') {
              rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'pbx-mongo:27017'}]}).ok
                ? quit(0) : quit(1);
            } else { quit(1); }
          }
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # ──────────────────────────────────────────────────────────────────
  # Asterisk — chan_pjsip SIP-over-WS transport + ARI events/REST.
  # ──────────────────────────────────────────────────────────────────
  pbx-asterisk:
    image: andrius/asterisk:20
    container_name: pbx-asterisk
    restart: unless-stopped
    volumes:
      - ./docker/asterisk/asterisk.conf:/etc/asterisk/asterisk.conf:ro
      - ./docker/asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./docker/asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./docker/asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      # sorcery.conf maps pjsip.aor/endpoint/auth to the astdb wizard so
      # the agent's ARI dynamic-config PUTs persist. Without it Asterisk
      # returns 403 "Cannot create sorcery objects of type 'aor'" and
      # the SubscriberWatcher provisioning loop silently fails — every
      # browser REGISTER hits a non-existent endpoint. astdb persists
      # to /var/lib/asterisk/astdb.sqlite3 inside the container's
      # writable layer. Re-provisioning is idempotent so a clean
      # container catches up on first agent bootstrap scan.
      - ./docker/asterisk/sorcery.conf:/etc/asterisk/sorcery.conf:ro
      - ./docker/asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./docker/asterisk/confbridge.conf:/etc/asterisk/confbridge.conf:ro
      # DTLS-SRTP cert + key for chan_pjsip's media_encryption=dtls.
      # Generated locally by scripts/setup-society.sh — self-signed
      # is correct here: browsers verify the SDP `a=fingerprint` line
      # per-call, not a CA chain (RFC 5764). Rotate by regenerating.
      - ${ASTERISK_KEYS_DIR:-./certs/asterisk-dtls}:/etc/asterisk/keys:ro
    networks:
      - pbx-net
    # The agent reaches us at pbx-asterisk:8088 over the compose
    # network. NOT exposed to the host — chan_pjsip's WS transport
    # has no auth at the WS layer (SIP digest handles auth), so the
    # port stays internal.

  # ──────────────────────────────────────────────────────────────────
  # coturn — STUN + TURN for browser↔browser ICE.
  # ──────────────────────────────────────────────────────────────────
  pbx-coturn:
    image: coturn/coturn:4.6
    container_name: pbx-coturn
    restart: unless-stopped
    network_mode: host           # coturn needs the real public IP
    # in its STUN replies. host networking is the simplest way; trade
    # off is no isolation from the host network namespace.
    volumes:
      # turnserver.conf is rendered from turnserver.conf.template by
      # scripts/setup-society.sh — the rendered output is per-society
      # (real static-auth-secret, external-ip, realm) and lives
      # outside the repo (./certs/turnserver.conf by default, but
      # configurable via TURN_CONF_PATH).
      - ${TURN_CONF_PATH:-./certs/turnserver.conf}:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  # ──────────────────────────────────────────────────────────────────
  # pbx-agent — the on-prem control-plane daemon.
  # ──────────────────────────────────────────────────────────────────
  pbx-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    # docker.io tag so install.sh on the society side pulls a pre-built
    # image. Local dev (lima.sh) still uses `up --build`, which builds
    # a fresh image and tags it under the same name — both flows
    # converge on the same image label.
    image: docker.io/naushada/onprem-pbx-agent:latest
    container_name: pbx-agent
    restart: unless-stopped
    depends_on:
      pbx-mongo:
        condition: service_healthy
      pbx-asterisk:
        condition: service_started
    networks:
      - pbx-net
    environment:
      # Only the two operator-required knobs + optional inner-TLS hostname.
      # All other settings (cert paths, Mongo URI, Asterisk service DNS,
      # ARI app/user/pass) live as compile-time defaults in
      # pbx-agent/src/main/main.cpp because they're invariant for the
      # compose stack. Override via `command:` here if you need to.
      CLOUD_HOST:        ${CLOUD_HOST:?CLOUD_HOST required}
      AGENT_SOCIETY_ID:  ${AGENT_SOCIETY_ID:?AGENT_SOCIETY_ID required}
      INNER_TLS_HOSTNAME: ${INNER_TLS_HOSTNAME:-}
    volumes:
      # mTLS + InnerTLS material — comes from `./deploy-heroku.sh
      # cmd_extract_agent_certs` (runs as part of `deploy`). Every cloud
      # build mints a fresh CA + agent.{crt,key} family inside
      # Dockerfile.cloud and the deploy step pulls them out into this
      # dir. Override with CERTS_DIR=... to mount a different path
      # (e.g. a hand-managed cert set for an air-gapped install).
      - ${CERTS_DIR:-./certs/cloud-issued/sip-agent}:/opt/pbx-agent/certs:ro

  # ──────────────────────────────────────────────────────────────────
  # pbx-wsdbagent — DB-tunnel side of the on-prem stack.
  #
  # Dials wss://${CLOUD_HOST}/ws/db with ACE InnerTLS on top of the
  # outer WSS (Heroku terminates the outer TLS at the router; the
  # inner TLS handshake is what the cloud's wsdbproxy authenticates).
  # Each binary frame carries one BSON-encoded DbRequest / DbResponse.
  # Standalone binary per xpmile's pattern.
  # ──────────────────────────────────────────────────────────────────
  pbx-wsdbagent:
    build:
      context: .
      dockerfile: docker/Dockerfile.wsdbagent
    # See pbx-agent above for the local/registry tag-convergence note.
    image: docker.io/naushada/onprem-pbx-wsdbagent:latest
    container_name: pbx-wsdbagent
    restart: unless-stopped
    depends_on:
      pbx-mongo:
        condition: service_healthy
    networks:
      - pbx-net
    environment:
      CLOUD_HOST:    ${CLOUD_HOST:?CLOUD_HOST required}
      CLOUD_PORT:    ${CLOUD_PORT:-443}
      BACKOFF:       ${WSDBAGENT_BACKOFF:-5}
      # InnerTLS material is the project-shared CA + client leaf (see
      # certs/innertls/generate.sh). Outer-WSS still goes to
      # ${CLOUD_HOST} (Heroku's assigned hostname); the InnerTLS CN
      # check runs against TLS_HOSTNAME, which is the short
      # `pabx.herokuapp.com` baked into the cloud's server cert.
      TLS_CERT:      /opt/wsdbagent/innertls/client.crt
      TLS_KEY:       /opt/wsdbagent/innertls/client.key
      TLS_CA:        /opt/wsdbagent/innertls/ca.crt
      TLS_HOSTNAME:  ${TLS_HOSTNAME:-pabx.herokuapp.com}
      MONGO_URI:     mongodb://pbx-mongo:27017/${MONGO_DB_NAME:-pabx}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-pabx}
      MONGO_POOL:    ${MONGO_POOL:-10}
    volumes:
      # InnerTLS material — comes from `./deploy-heroku.sh
      # cmd_extract_agent_certs` (runs as part of `deploy`). Every cloud
      # build mints a fresh CA + client cert family inside Dockerfile.cloud
      # and the deploy step pulls them out of the image into this dir.
      # Override with INNERTLS_DIR=... to mount a different path.
      - ${INNERTLS_DIR:-./certs/cloud-issued/innertls}:/opt/wsdbagent/innertls:ro

  # ──────────────────────────────────────────────────────────────────
  # pbx-cert-watcher — restarts pbx-wsdbagent + pbx-agent whenever the
  # cloud-issued cert family changes on disk.
  #
  # The cloud's Dockerfile.cloud mints a fresh CA every build (PR #55
  # + #61). `./deploy-heroku.sh deploy` extracts the matching client
  # cert families into ./certs/cloud-issued/{innertls,sip-agent}/.
  # The on-prem daemons bind-mount those dirs and read certs ONCE at
  # startup — they don't watch for file changes. Without this sidecar
  # the operator has to `podman restart` both containers manually
  # after every deploy.
  #
  # This watcher md5sums the cert files every 5s and on any change
  # POSTs `/libpod/containers/<name>/restart` to the host podman
  # socket. Restart is best-effort — failures are logged and the next
  # poll cycle retries.
  #
  # Polling (not inotify) because virtiofs in Lima doesn't reliably
  # deliver inotify events across the host→VM mount.
  # ──────────────────────────────────────────────────────────────────
  pbx-cert-watcher:
    image: docker.io/library/alpine:3.19
    container_name: pbx-cert-watcher
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache curl >/dev/null
        log() { printf '[cert-watcher %s] %s\n' "$$(date -u +%H:%M:%S)" "$$1"; }
        log "watching /watch every $${POLL_SECONDS:-5}s for cert changes"
        LAST=""
        while true; do
          NEW=$$(find /watch -type f \( -name '*.crt' -o -name '*.key' -o -name '*.pem' \) -exec md5sum {} + 2>/dev/null \
                 | sort | md5sum | cut -d' ' -f1)
          if [ -n "$$NEW" ] && [ "$$NEW" != "$$LAST" ]; then
            if [ -n "$$LAST" ]; then
              log "cert change detected ($$LAST -> $$NEW); restarting peers"
              for c in pbx-wsdbagent pbx-agent; do
                if curl -fsS -X POST --unix-socket /run/podman/podman.sock \
                        "http://d/v4.0.0/libpod/containers/$$c/restart?timeout=5" >/dev/null; then
                  log "  $$c restarted"
                else
                  log "  $$c restart FAILED (will retry next change)"
                fi
              done
            else
              log "first observation: $$NEW (no restart, baseline)"
            fi
            LAST=$$NEW
          fi
          sleep $${POLL_SECONDS:-5}
        done
    environment:
      POLL_SECONDS: ${CERT_WATCH_POLL_SECONDS:-5}
    volumes:
      - ${CLOUD_ISSUED_DIR:-./certs/cloud-issued}:/watch:ro
      # Host podman socket — used to issue restarts on sibling
      # containers. Rootful podman default path; override with
      # PODMAN_SOCKET=... if your install uses rootless or a
      # different location.
      - ${PODMAN_SOCKET:-/run/podman/podman.sock}:/run/podman/podman.sock
    depends_on:
      pbx-wsdbagent:
        condition: service_started
      pbx-agent:
        condition: service_started

volumes:
  pbx_mongo_data:

networks:
  pbx-net:
    driver: bridge
