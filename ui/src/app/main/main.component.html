<clr-main-container>
    <clr-header class="header">
        <div class="branding">
            <span class="title">Society Softphone</span>
        </div>

        <div class="header-actions">
            <span *ngIf="subscriber" class="who">
                {{ subscriber.flatNumber }}<span *ngIf="subscriber.displayName">
                · {{ subscriber.displayName }}</span>
            </span>
            <a href="javascript:void(0)" (click)="onSignOut()" class="nav-link nav-text">
                Sign out
            </a>
        </div>
    </clr-header>

    <div class="content-container">
        <clr-vertical-nav>
            <a clrVerticalNavLink routerLink="dashboard" routerLinkActive="active">Dashboard</a>
            <a clrVerticalNavLink routerLink="directory" routerLinkActive="active">Directory</a>
        </clr-vertical-nav>

        <div class="content-area">
            <router-outlet></router-outlet>
        </div>
    </div>

    <!-- Active-call overlay lives at the shell level so the audio
         keeps playing as the user navigates between child routes. -->
    <app-call-panel></app-call-panel>
</clr-main-container>
