<clr-main-container>
    <clr-header class="header">
        <div class="branding">
            <span class="title">Society Softphone</span>
        </div>

        <div class="header-actions">
            <span *ngIf="subscriber" class="who">
                {{ subscriber.flatNumber }}<span *ngIf="subscriber.displayName">
                · {{ subscriber.displayName }}</span>
            </span>
            <a href="javascript:void(0)" (click)="onSignOut()" class="nav-link nav-text">
                Sign out
            </a>
        </div>
    </clr-header>

    <div class="content-container">
        <div class="content-area">
            <router-outlet></router-outlet>
        </div>
    </div>
</clr-main-container>
