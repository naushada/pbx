<section class="dashboard">
    <h2>Welcome<span *ngIf="subscriber">, {{ subscriber.displayName || subscriber.flatNumber }}</span></h2>

    <div class="status-card" *ngIf="subscriber">
        <dl class="info-grid">
            <dt>Society</dt>  <dd>{{ subscriber.societyId }}</dd>
            <dt>Flat</dt>     <dd>{{ subscriber.flatNumber }}</dd>
            <dt>SIP user</dt> <dd>{{ subscriber.sipUser }}</dd>
            <dt>Role</dt>     <dd>{{ subscriber.role || 'resident' }}</dd>
        </dl>
    </div>

    <div class="sip-card">
        <div [ngClass]="statusClass()" role="status">{{ statusLabel() }}</div>
        <div class="actions">
            <button type="button" class="btn btn-primary"
                    (click)="onConnect()" [disabled]="!canConnect()">
                Connect
            </button>
            <button type="button" class="btn btn-outline"
                    (click)="onDisconnect()" [disabled]="!canDisconnect()">
                Disconnect
            </button>
        </div>
    </div>

    <p class="placeholder">Directory + dialer land in slice 3.</p>
</section>
