# Publish container images on every push to main + cloud-deploy to Heroku.
#
# Three jobs:
#
# Job 1 — pbx-cpp-builder:bootstrap — the shared toolchain layer
# (ACE/TAO 7.0.0 + mongo-cxx-driver + googletest, on ubuntu:20.04).
# Slow (~30 min per arch when not cached). Pushed first so Job 2 + 3
# can `FROM` it via the BUILDER_IMAGE ARG.
#
# Job 2 — pbx-agent + pbx-wsdbagent — the on-prem service images.
# Matrix-built (one runner per service), each multi-arch (amd64+arm64).
# Published to docker.io/naushada/onprem-pbx-*:latest. Consumed by
# install.sh on society machines via `podman-compose pull`.
#
# Job 3 — pbx-cloud — built amd64-only (Heroku Common Runtime is
# amd64-only), pushed to registry.heroku.com/pabx/web, then released
# via `heroku container:release web --app pabx`. Replaces the manual
# `./deploy-heroku.sh deploy` round-trip from the dev's laptop. The
# manual script stays available as an escape hatch.
#
# Tags published:
#   docker.io/naushada/pbx-cpp-builder:bootstrap        (rolling)
#   docker.io/naushada/pbx-cpp-builder:<sha>            (immutable)
#   docker.io/naushada/onprem-pbx-agent:latest          (rolling)
#   docker.io/naushada/onprem-pbx-agent:<sha>           (immutable)
#   docker.io/naushada/onprem-pbx-wsdbagent:latest      (rolling)
#   docker.io/naushada/onprem-pbx-wsdbagent:<sha>       (immutable)
#
# `install.sh` on the society side pulls the `:latest` tags via
# docker-compose `image:` references. Pinning a society to a known-
# good build = edit its docker-compose.agent.yml to a `:<sha>` tag.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME = naushada
#   DOCKERHUB_TOKEN    = a Docker Hub access token with write scope
#                        (NOT your account password; create one at
#                        https://hub.docker.com/settings/security)
#   HEROKU_API_KEY     = your Heroku account API key
#                        (NOT your account password; create one at
#                        https://dashboard.heroku.com/account →
#                        "Authorizations" → "Create authorization")

name: Publish container images

on:
  push:
    branches: [main]
    paths:
      # Skip the workflow when nothing publishable changed — saves
      # ~1 GB of registry pulls per docs-only PR.
      - 'docker/Dockerfile.bootstrap'
      - 'docker/Dockerfile.agent'
      - 'docker/Dockerfile.wsdbagent'
      - 'modules/**'
      - 'pbx-agent/**'
      - 'CMakeLists.txt'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

# Latest-push-wins: a newer push to main auto-cancels any earlier
# in-flight run of THIS workflow for THIS ref. Saves CI minutes and
# avoids the "v40 published from PR #93 while v41 is being built from
# PR #95" race we'd otherwise hit on a busy day. `cancel-in-progress: true`
# is what does the work; the `group:` key just scopes "what counts as
# the same queue". Same {workflow, ref} pair = same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  ORG:      naushada
  BOOTSTRAP_IMAGE: docker.io/naushada/pbx-cpp-builder

jobs:

  bootstrap:
    name: Publish pbx-cpp-builder:bootstrap (multi-arch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push pbx-cpp-builder:bootstrap
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.bootstrap
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BOOTSTRAP_IMAGE }}:bootstrap
            ${{ env.BOOTSTRAP_IMAGE }}:${{ github.sha }}
          # Buildx registry-side cache so re-runs reuse layers.
          # `mode=max` exports every intermediate layer; without it we
          # only cache the final stage and lose most of the speedup.
          cache-from: type=registry,ref=${{ env.BOOTSTRAP_IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.BOOTSTRAP_IMAGE }}:buildcache,mode=max

  services:
    name: Publish onprem-pbx-${{ matrix.service }} (multi-arch)
    needs: bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent
            dockerfile: docker/Dockerfile.agent
          - service: wsdbagent
            dockerfile: docker/Dockerfile.wsdbagent
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILDER_IMAGE=${{ env.BOOTSTRAP_IMAGE }}:bootstrap
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/onprem-pbx-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/onprem-pbx-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/onprem-pbx-${{ matrix.service }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/onprem-pbx-${{ matrix.service }}:buildcache,mode=max

  publish-cloud:
    name: Deploy pbx-cloud to Heroku (amd64-only)
    needs: bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (amd64 emulation if needed)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Heroku Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          # Heroku registry auth convention: username is the literal
          # underscore; password is the account API key (NOT a Docker
          # Hub password).
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      - name: Build + push pbx-cloud to Heroku registry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.cloud
          # Heroku Common Runtime is amd64-only; no point publishing
          # arm64 here.
          platforms: linux/amd64
          push: true
          build-args: |
            BUILDER_IMAGE=${{ env.BOOTSTRAP_IMAGE }}:bootstrap
          tags: |
            registry.heroku.com/pabx/web:latest
          # Heroku registry rejects OCI manifests (--format=v2s2 is
          # what the manual `podman push` uses). Tell Buildx to emit
          # the legacy docker manifest format AND skip the attestation
          # files (provenance + sbom) Heroku also rejects.
          provenance: false
          outputs: type=image,oci-mediatypes=false

      - name: Install Heroku CLI (one-shot, ~10 s)
        run: |
          curl -fsSL https://cli-assets.heroku.com/install.sh | sudo sh

      - name: Release the dyno (heroku container:release web)
        env:
          # The CLI honours HEROKU_API_KEY when there's no interactive
          # login — same secret the registry login above used.
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku container:release web --app pabx
