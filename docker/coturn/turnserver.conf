#
# turnserver.conf — minimal coturn for the society's TURN service.
#
# Topology (per DESIGN.md §3.2):
#   - Browsers (off-LAN) use this as a TURN relay when ICE direct-P2P
#     fails. The society opens ONE public UDP port and DNATs to the
#     port below.
#   - Asterisk's ConfBridge legs always traverse the on-prem box;
#     coturn is only relevant for browser↔browser 1:1 calls.
#
# Auth: time-limited credentials issued by the cloud's
# `GET /api/v1/turn-credentials` endpoint, signed with
# societies.turnSharedSecret using HMAC-SHA1 (RFC 5766 §5).
#
# Override `static-auth-secret` and `realm` per society — the value
# below is for local development only.
#

# Listening sockets.
listening-port=3478
fingerprint
no-multicast-peers

# realm + shared secret — must match the society document's
# turnSharedSecret. The cloud mints time-limited
# (username=<unix_ts>:<sip_user>, password=HMAC-SHA1(secret, username))
# credentials on the wire; coturn validates with use-auth-secret.
realm=pbx.local
use-auth-secret
static-auth-secret=dev-only-shared-secret-override-in-prod

# Local-dev quotas (very small; tune for production).
user-quota=100
total-quota=300
max-bps=512000

# Process hygiene.
no-cli
syslog
