;
; ari.conf — Asterisk REST Interface.
;
; The pbx-agent's AriClient subscribes to channel + bridge events here;
; AriRestClient posts to /ari/applications/.../subscription and
; /ari/channels/.../continue.
;
; Auth is HTTP Basic over plain HTTP — the port is bound to the compose
; network only, no outside reach.
;
; The default `asterisk:asterisk` credential matches pbx-agent's
; default --ari-user / --ari-pass. Override both at deploy time.
;
[general]
enabled              = yes
pretty               = yes
allowed_origins      = *
auth_realm           = Asterisk REST Interface

; websocket_write_timeout — how long (ms) Asterisk waits for a write to
; the ARI events WebSocket to drain before declaring the peer dead and
; closing the socket. Default is 100ms.
;
; The pbx-agent reads /ari/events on a single ACE reactor thread and —
; in the same callstack — makes blocking /ari REST calls for call
; routing (CallRouter -> AriRestClient: originate, create_bridge,
; add_channel_to_bridge, hangup). While that call-setup burst blocks,
; the agent stops draining the events WebSocket; with the 100ms default
; Asterisk sees the write stall, logs `ari/ari_websockets.c
; session_write: Problem occurred ...`, and closes the ARI socket. The
; agent reconnects, Asterisk destroys+recreates the Stasis app, the
; in-Stasis channels re-fire StasisStart, and the cycle repeats every
; ~3s for the whole call — so CallRouter never finishes
; originate->answer->bridge and calls stall at "Calling..." with no
; audio.
;
; 10s gives the reactor ample headroom to finish a call-setup burst.
; The agent-side single-thread fix (AriDispatchTask — events processed
; off the reactor thread) is the real cure; this keeps the ARI socket
; alive in the meantime.
websocket_write_timeout = 10000

[asterisk]
type      = user
read_only = no
password  = asterisk
password_format = plain
