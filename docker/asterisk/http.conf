;
; http.conf — Asterisk's built-in HTTP server.
;
; Hosts:
;   /ari/...      → ARI REST (consumed by pbx-agent's AriRestClient)
;   /ari/events   → ARI WebSocket events (consumed by AriWsClient)
;   /ws           → chan_pjsip's SIP-over-WebSocket transport
;                   (consumed by pbx-agent's AsteriskWsFactory)
;
; bindaddr=0.0.0.0 so the pbx-agent container can reach us at
; `pbx-asterisk:8088` over the compose network. In a hardened
; deployment you'd bind to a network-internal interface only.
;
[general]
enabled     = yes
bindaddr    = 0.0.0.0
bindport    = 8088
prefix      =
servername  = pbx-asterisk
sessionlimit = 100
