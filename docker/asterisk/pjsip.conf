;
; pjsip.conf — minimal chan_pjsip config for the pbx-agent stack.
;
; - transport-wss: WebSocket transport on /ws (HTTP port 8088 from
;   http.conf). pbx-agent's AsteriskWsFactory dials this per browser
;   stream.
; - endpoint-template: shared baseline for SIP-over-WS endpoints.
;   directmedia=yes means 1:1 RTP goes browser↔browser; ConfBridge
;   re-INVITEs to bring media back through Asterisk for conferences.
; - "wildcard" template — real endpoints are provisioned at runtime
;   by the cloud's subscriber-import flow (writing entries to a
;   secondary realtime backend would replace this in production).
;   For local dev, define endpoints inline.
;

[transport-ws]
type     = transport
protocol = ws
bind     = 0.0.0.0:0   ; bound by http.conf, not here

[endpoint-resident-template](!)
type            = endpoint
context         = pbx
disallow        = all
allow           = opus
allow           = ulaw
allow           = alaw
direct_media    = yes
rtcp_mux        = yes
ice_support     = yes
use_avpf        = yes
force_avp       = yes
media_use_received_transport = yes
rewrite_contact = yes
rtp_symmetric   = yes
transport       = transport-ws
webrtc          = yes
auth_type       = md5
realm           = pbx.local

; ── Local-dev fixture endpoints. Replace at deploy time with the
;    subscriber list generated by the cloud's CSV import.
;
; Plaintext password for hand-testing only; production stores the
; pre-computed HA1 in MongoDB and the realm template above gives
; chan_pjsip everything it needs to validate digests.

[alice](endpoint-resident-template)
type = endpoint
auth = alice-auth
aors = alice-aor

[alice-auth]
type     = auth
auth_type= userpass
username = alice
password = secret
realm    = pbx.local

[alice-aor]
type = aor
max_contacts = 5

[bob](endpoint-resident-template)
type = endpoint
auth = bob-auth
aors = bob-aor

[bob-auth]
type     = auth
auth_type= userpass
username = bob
password = secret
realm    = pbx.local

[bob-aor]
type = aor
max_contacts = 5
