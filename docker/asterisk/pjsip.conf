;
; pjsip.conf — minimal chan_pjsip config for the pbx-agent stack.
;
; - transport-wss: WebSocket transport on /ws (HTTP port 8088 from
;   http.conf). pbx-agent's AsteriskWsFactory dials this per browser
;   stream.
; - endpoint-template: shared baseline for SIP-over-WS endpoints.
;   directmedia=yes means 1:1 RTP goes browser↔browser; ConfBridge
;   re-INVITEs to bring media back through Asterisk for conferences.
; - "wildcard" template — real endpoints are provisioned at runtime
;   by the cloud's subscriber-import flow (writing entries to a
;   secondary realtime backend would replace this in production).
;   For local dev, define endpoints inline.
;

[transport-ws]
type     = transport
protocol = ws
bind     = 0.0.0.0:0   ; bound by http.conf, not here

[endpoint-resident-template](!)
type            = endpoint
context         = pbx
disallow        = all
allow           = opus
allow           = ulaw
allow           = alaw
direct_media    = yes
rtcp_mux        = yes
ice_support     = yes
use_avpf        = yes
force_avp       = yes
media_use_received_transport = yes
rewrite_contact = yes
rtp_symmetric   = yes
transport       = transport-ws
webrtc          = yes

; Note: auth_type + realm belong in the [<name>-auth] section, NOT
; on the endpoint. Listing them here causes Asterisk to refuse the
; endpoint with "Could not find option suitable for category …
; named 'auth_type'". The per-subscriber auth blocks below carry them.

; ── DTLS-SRTP (browsers require it — RFC 5764, DESIGN.md §8) ─────────
;
; Cert + key are generated by scripts/setup-society.sh at install time
; and mounted at /etc/asterisk/keys/{pbx.crt,pbx.key}. Browsers verify
; the SDP `a=fingerprint:sha-256 …` line that Asterisk auto-emits from
; this cert, so self-signed is fine — the trust binding is per-call,
; not per-CA.
media_encryption   = dtls
dtls_verify        = fingerprint
dtls_setup         = actpass
dtls_cert_file     = /etc/asterisk/keys/pbx.crt
dtls_private_key   = /etc/asterisk/keys/pbx.key
dtls_rekey         = 0

; ── Conference-friendly variant ──────────────────────────────────────
;
; For endpoints that join ConfBridge, direct_media must be off so
; Asterisk stays on the media path and can mix. Use this template
; instead of -resident-template for the synthetic `conf` endpoint
; below. The `(!,…)` marker makes this BOTH a template AND an
; inheritor of the base.
[endpoint-conf-template](!,endpoint-resident-template)
direct_media       = no

; ── Local-dev fixture endpoints. Replace at deploy time with the
;    subscriber list generated by the cloud's CSV import.
;
; Plaintext password for hand-testing only; production stores the
; pre-computed HA1 in MongoDB and the realm template above gives
; chan_pjsip everything it needs to validate digests.

[alice](endpoint-resident-template)
type = endpoint
auth = alice-auth
aors = alice-aor

[alice-auth]
type     = auth
auth_type= userpass
username = alice
password = secret
realm    = pbx.local

[alice-aor]
type = aor
max_contacts = 5

[bob](endpoint-resident-template)
type = endpoint
auth = bob-auth
aors = bob-aor

[bob-auth]
type     = auth
auth_type= userpass
username = bob
password = secret
realm    = pbx.local

[bob-aor]
type = aor
max_contacts = 5

; ── Conference endpoint ──────────────────────────────────────────────
;
; The UI's "Join conference" action dials `sip:conf@pbx.<society>`.
; chan_pjsip matches the user-part `conf` to this anonymous-style
; endpoint, the dialplan ([pbx-conf-room] in extensions.conf) then
; ConfBridge()s the channel.
[conf](endpoint-conf-template)
type    = endpoint
context = pbx-conf-room
