;
; extensions.conf — dialplan for the pbx-agent stack.
;
; Stasis(pbx) hands every inbound INVITE to the agent's AriClient.
; The agent then either:
;   - lets the call proceed (under admission cap), in which case
;     Asterisk's ConfBridge / Dial mediates the media; or
;   - REST-POSTs /ari/channels/{cid}/continue to send the channel to
;     the `pbx-busy` context below (see AriClient::handle_stasis_start
;     when active_bridges >= max_concurrent_calls).
;

[globals]
PBX_APP=pbx

[pbx]
; All inbound calls land in Stasis. The agent does admission and
; routing; the dialplan stays thin.
exten => _.,1,NoOp(pbx: ${EXTEN} from ${CALLERID(num)})
 same => n,Stasis(${PBX_APP},${EXTEN})
 same => n,Hangup()

[pbx-busy]
; Targeted by AriRestClient::continue_in_dialplan when admission is
; denied. Plays the standard "all circuits busy" message and hangs up
; with cause 17 (User busy) so the caller sees 503.
exten => s,1,NoOp(pbx: admission denied for ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(all-circuits-busy-pls-try-call-later)
 same => n,Hangup(17)
