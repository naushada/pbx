;
; asterisk.conf — base options for the pbx-agent stack.
;
; Minimal config. Asterisk's default config tree has dozens of files;
; we only ship the four we care about (asterisk.conf, http.conf,
; ari.conf, pjsip.conf, extensions.conf) and let Asterisk fall back
; to its packaged defaults for everything else.
;
[directories](!)
astetcdir   => /etc/asterisk
astmoddir   => /usr/lib/asterisk/modules
astvarlibdir=> /var/lib/asterisk
astdbdir    => /var/lib/asterisk
astkeydir   => /var/lib/asterisk
astdatadir  => /var/lib/asterisk
astagidir   => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir   => /var/run/asterisk
astlogdir   => /var/log/asterisk
astsbindir  => /usr/sbin

[options]
verbose      = 3
debug        = 0
runuser      = asterisk
rungroup     = asterisk
documentation_language = en_US
