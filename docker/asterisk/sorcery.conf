; ──────────────────────────────────────────────────────────────────
; sorcery.conf — make pjsip aor/endpoint/auth dynamically writable.
;
; Out of the box, Asterisk maps res_pjsip's sorcery objects to the
; `config` wizard, which reads `pjsip.conf` and is read-only at runtime.
; That makes every ARI dynamic-config PUT return:
;   403 "Cannot create sorcery objects of type 'aor'"
; — which is what blocks PjsipProvisioner from registering subscribers
; (see PR #100 for the agent-side gate that ran first).
;
; The pair of wizards per object type is intentional:
;   - astdb persists to /var/lib/asterisk/astdb.sqlite3, accepts PUT/DELETE
;   - config stays as a read-only fallback so the static
;     [endpoint-resident-template] declaration in pjsip.conf still
;     loads at boot for any operator-curated identities.
;
; Sorcery checks wizards in declaration order on read; on write it
; targets the first writable wizard (astdb). For dynamic subscribers
; coming from Mongo via SubscriberWatcher, astdb is the only source —
; the config wizard's [endpoint-resident-template] is referenced by
; PjsipProvisioner's PUT body field-by-field (sorcery dynamic objects
; don't inherit (!)-marked templates from pjsip.conf).
; ──────────────────────────────────────────────────────────────────

; astdb wizard syntax: `astdb,<family>` — the family is the namespace
; key under which Asterisk persists the type's objects in astdb.sqlite3.
; res_sorcery_astdb fails to open the mapping if the data field is
; empty (Asterisk logs "Wizard 'astdb' failed to open mapping for
; object type 'endpoint' with data:" and res_pjsip declines to load).
[res_pjsip]
endpoint = astdb,pjsip-endpoint
endpoint = config,criteria=type=endpoint
aor      = astdb,pjsip-aor
aor      = config,criteria=type=aor
auth     = astdb,pjsip-auth
auth     = config,criteria=type=auth
