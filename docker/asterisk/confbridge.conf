;
; confbridge.conf — single shared conference profile for the
; society's "join conference" feature.
;
; The UI dials sip:conf@pbx.<society> → chan_pjsip matches the
; [conf] endpoint in pjsip.conf → context [pbx-conf-room] in
; extensions.conf → ConfBridge(<society-room>, bridge-society,
; user-society). All callers within the same society share one
; mixing bridge.
;
; Media security: each leg DTLS-handshakes with Asterisk separately,
; gets mixed in plaintext inside the bridge process, then re-encrypted
; per-leg on output. Browsers see SRTP throughout. (See
; docs/design/security/media.md § "Two media-path shapes" — conference
; audio is on-prem-plaintext, 1:1 is end-to-end.)
;

[general]

; ── Bridge profile ──────────────────────────────────────────────────
[bridge-society]
type = bridge
; Default mixing bridge — Asterisk picks the right kind based on
; whether participants need video/text. For voice-only the result
; is a softmix.
internal_sample_rate = auto
mixing_interval      = 20
video_mode           = none
record_conference    = no

; ── User profile (per-leg behaviour) ────────────────────────────────
[user-society]
type             = user
; Enter / leave audio cues — useful when you have 3-5 people on the
; line and someone joins late.
announce_join_leave    = yes
announce_user_count    = no
; Don't gate entry on a PIN; the cloud's bearer + SIP digest already
; gated the call.
pin                    = no
; Music on hold while waiting for the first other participant.
music_on_hold_when_empty = yes
; DTMF passthrough — let users mute/unmute via *6 etc.
dtmf_passthrough         = yes
end_marked               = no
; Talk detection so the bridge can hint "who's speaking" in stats.
talk_detection_events    = yes
