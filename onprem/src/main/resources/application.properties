# HTTP port for the Vaadin admin UI. 8081 keeps it clear of the C++ cloud
# (8080) on the same host, so a dev can run both side by side.
server.port=8081

# Base URL of the C++ pbx-cloud REST API. Override for staging/prod, e.g.
# `--backend.url=https://onprem-pbx-cloud.herokuapp.com`.
backend.url=http://localhost:8080

# Logged by Spring Boot at startup; also surfaces in actuator if added later.
spring.application.name=onprem-pbx-onprem-ui

# Don't pop a browser tab when the dev runs `mvn spring-boot:run` — most
# operators tunnel from a headless box.
vaadin.launch-browser=false
